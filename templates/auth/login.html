{% extends "base.html" %}
{% block title %}Log In — {{ site_name }}{% endblock %}
{% block content %}
<section class="container my-5" style="max-width: 420px;">
  <div class="text-center mb-4">
    <i class="bi bi-mortarboard-fill display-3 text-navy"></i>
    <h1 class="mt-2">{{ site_name }}</h1>
  </div>

  {% if needs_setup %}
    <div class="alert alert-info">
      No account exists yet. <a href="{{ url_for('auth.register') }}">Create one</a> to get started.
    </div>
  {% endif %}

  <form method="POST" class="card p-4 shadow-sm">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-gold w-100">Log In</button>
  </form>
</section>
{% endblock %}

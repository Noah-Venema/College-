{% extends "base.html" %}
{% block title %}Create Account — {{ site_name }}{% endblock %}
{% block content %}
<section class="container my-5" style="max-width: 420px;">
  <div class="text-center mb-4">
    <i class="bi bi-mortarboard-fill display-3 text-navy"></i>
    <h1 class="mt-2">Create Your Account</h1>
    <p class="text-muted">Set up the account for {{ site_name }}.</p>
  </div>

  <form method="POST" class="card p-4 shadow-sm">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm Password</label>
      <input type="password" name="confirm" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-gold w-100">Create Account</button>
    <p class="text-center mb-0 mt-3">
      Already have an account? <a href="{{ url_for('auth.login') }}">Log In</a>
    </p>
  </form>
</section>
{% endblock %}
